<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PromoRadar AI</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#f7faf8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PromoRadar AI" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><span></span></div>
        <div>
          <h1>PromoRadar AI</h1>
          <p>Акции топ-бирж в одном месте</p>
        </div>
      </div>
      <button class="settings" id="settingsBtn">⚙️</button>
    </header>

    <section class="filters-card">
      <div class="filter-head">
        <h2>Мой депозит</h2>
        <button class="mini-select" id="depositLabel">50 USDT⌄</button>
      </div>
      <div class="chips deposit" id="depositChips"></div>
      <div class="line"></div>
      <div class="filter-head">
        <h2>Биржи</h2>
        <button class="mini-select" id="exchangeCount">4 из 7⌄</button>
      </div>
      <div class="chips exchanges" id="exchangeChips"></div>
      <div class="line"></div>
      <div class="filter-head">
        <h2>Тип акций</h2>
        <button class="mini-select" id="typeLabel">Все⌄</button>
      </div>
      <div class="chips types" id="typeChips"></div>
    </section>

    <section class="section-title">
      <h2>Лучшие акции сейчас</h2>
      <button class="sort">↗ По потенциалу⌄</button>
    </section>

    <section class="best-card" id="bestCard"></section>
    <section class="offers" id="offers"></section>
  </main>

  <nav class="bottom-nav">
    <button class="active">◎<span>Главная</span></button>
    <button>☆<span>Избранное</span></button>
    <button>🔔<span>Уведомления</span></button>
    <button>▥<span>Статистика</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
