<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6fbf7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PromoRadar AI" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <title>PromoRadar AI</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brandMark" aria-hidden="true">
        <span class="ring r1"></span><span class="ring r2"></span><span class="dot"></span>
      </div>
      <div class="brandText">
        <h1>PromoRadar AI</h1>
        <p>Акции топ-бирж в одном месте</p>
      </div>
      <button class="settingsBtn" id="settingsBtn" aria-label="Настройки">⚙️</button>
    </header>

    <main>
      <section class="controlPanel">
        <div class="filterBlock compact">
          <div class="rowTitle"><b>Депозит</b><span id="depositLabel">100 USDT</span></div>
          <div class="chipRow" id="depositChips"></div>
        </div>

        <div class="filterBlock compact">
          <div class="rowTitle"><b>Биржи</b><span id="exchangeCount">7 из 7</span></div>
          <div class="chipRow exchangeRow" id="exchangeChips"></div>
        </div>

        <div class="filterBlock compact last">
          <div class="rowTitle"><b>Тип</b><span id="typeLabel">Все</span></div>
          <div class="chipRow typeRow" id="typeChips"></div>
        </div>
      </section>

      <section class="summaryLine">
        <div>
          <h2>Лучшие акции сейчас</h2>
          <p id="resultMeta">Сортировка по потенциалу</p>
        </div>
        <button class="sortBtn" id="sortBtn">↗ По выгоде</button>
      </section>

      <section class="bestCard" id="bestCard"></section>
      <section class="offers" id="offers"></section>
    </main>
  </div>

  <dialog class="settingsPanel" id="settingsPanel">
    <div class="sheetHead">
      <strong>Настройки</strong>
      <button id="closeSettings">×</button>
    </div>
    <div class="settingItem">
      <span>Уведомления</span>
      <label class="switch"><input type="checkbox" checked><i></i></label>
    </div>
    <div class="settingItem">
      <span>Показывать только доступные</span>
      <label class="switch"><input type="checkbox" id="availableOnly"><i></i></label>
    </div>
    <div class="settingNote">
      v5 compact • одна страница • данные пока локальные. Следующий шаг — реальные API/парсинг акций бирж.
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
